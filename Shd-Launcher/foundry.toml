[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
    "solady/=lib/solady/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
pulsechain = "https://rpc.pulsechain.com"
pulsechain_testnet = "https://rpc.v4.testnet.pulsechain.com"

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.fast]
via_ir = false
optimizer_runs = 200
